name: reusable-powershell-pr-validation

on:
  workflow_call:
    inputs:
      runs-on:
        required: false
        type: string
        default: windows-latest
      test-path:
        required: false
        type: string
        default: ./tests
      pester-version:
        required: false
        type: string
        default: 5.6.1
      artifact-name:
        required: false
        type: string
        default: pester-results

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ inputs.runs-on }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion ${{ inputs.pester-version }} -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run Pester
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = "${{ inputs.test-path }}"
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'TestResults/pester-test-results.xml'
          $config.TestResult.OutputFormat = 'NUnitXml'
          Invoke-Pester -Configuration $config

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: 'TestResults/*'
